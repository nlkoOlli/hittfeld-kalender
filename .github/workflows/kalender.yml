name: Kalender aktualisieren

on:
  schedule:
    - cron: "17 */6 * * *"   # alle 6 Stunden
  workflow_dispatch:          # zusätzlich manuell startbar

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gawk tesseract-ocr tesseract-ocr-deu \
            imagemagick perl cron nginx php-fpm fontconfig fonts-dejavu-core

      - name: fussballcal holen
        run: git clone --depth 1 https://github.com/JanuszKornath/fussballcal.git

      - name: fussballcal einrichten
        working-directory: fussballcal
        run: sudo scripts/deploy.sh --no-nginx

      - name: Selbsttest (nur zur Information)
        continue-on-error: true
        run: sudo /srv/spielplanoffline/selftest.sh

      - name: Verein eintragen
        run: |
          echo 'tsv_eintracht_hittfeld;https://www.fussball.de/verein/tsv-eintracht-hittfeld-niedersachsen/-/id/00ES8GN7RK00006OVV0AG08LVUPGND5I' \
            | sudo tee /srv/spielplanoffline/teams.txt

      - name: Spielpläne abrufen
        run: sudo /srv/spielplanoffline/update_all.sh

      - name: Log anzeigen
        if: always()
        run: tail -n 100 /var/log/spielplanoffline.log || true

      - name: Veröffentlichung vorbereiten
        run: |
          mkdir -p public
          sudo cp /var/www/fussballcal/ics/*.ics public/
          sudo chown -R "$USER" public
          ls -l public
          test -n "$(ls public/*.ics 2>/dev/null)"
          {
            echo '<!doctype html><meta charset="utf-8"><title>Spielplan Hittfeld</title>'
            echo '<h1>Kalender TSV Eintracht Hittfeld</h1><ul>'
            for f in public/*.ics; do
              n=$(basename "$f")
              echo "<li><a href=\"$n\">$n</a></li>"
            done
            echo '</ul>'
          } > public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
